# Carga una vez las cifras de quincenas pasadas (sin rásters) para que el gráfico del
# monitor compare con años anteriores. Un job por año en paralelo; después los une en
# serie.json y commitea. Se corre a mano: Actions → Histórico del monitor → Run workflow.
name: Histórico del monitor

on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Primer año"
        default: "2017"
      hasta:
        description: "Último año"
        default: "2026"

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  anios:
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.lista.outputs.lista }}
    steps:
      - id: lista
        run: echo "lista=$(python3 -c "import os; print(list(range(int(os.environ['DESDE']), int(os.environ['HASTA']) + 1)))")" >> "$GITHUB_OUTPUT"
        env:
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}

  anio:
    needs: anios
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        anio: ${{ fromJSON(needs.anios.outputs.lista) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/02_historico.py --anio ${{ matrix.anio }} --salida salida/serie_${{ matrix.anio }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serie-${{ matrix.anio }}
          path: salida/serie_${{ matrix.anio }}.json
          if-no-files-found: ignore

  unir:
    needs: anio
    # Une aunque falle algún año, pero no si se canceló la corrida
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # El main de ahora y no el commit del disparo: los años tardan horas y mientras
      # tanto Monitor satelital puede haber commiteado serie.json (si no, el rebase choca)
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: serie-*
          path: salida
          merge-multiple: true
      - run: python pipeline/02_historico.py --unir salida/serie_*.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor/data/serie.json
          if ! git diff --cached --quiet; then
            git commit -m "Monitor: histórico $DESDE-$HASTA"
            git pull --rebase && git push
          fi
        env:
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}

  publicar:
    needs: unir
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publicar.yml
